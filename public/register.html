<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | DevShop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="register">
  <header class="navbar" id="nav"></header>
  <main>
    <div class="panel auth-box">
      <h1>Create Account</h1>
      <div id="msg" class="msg"></div>
      <form id="form">
        <div class="form-group"><label>Full name</label><input name="name" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" minlength="6" required></div>
        <div class="form-group"><label>Confirm password</label><input type="password" name="confirm" minlength="6" required></div>
        <button class="btn block">Register</button>
      </form>
      <p style="margin-top:12px">Already have an account? <a href="/login.html">Login</a></p>
    </div>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
